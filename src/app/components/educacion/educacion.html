<div class="bg-gray-100 dark:bg-gray-800 rounded-lg p-4 md:p-6">
    <h2 class="text-sm font-semibold tracking-wide uppercase text-teal-600 dark:text-teal-400 mb-6">
        Educación
    </h2>

    <div class="flex flex-col">
        @for (e of escuelas; track e.titulo; let last = $last) {
        <div class="py-4 first:pt-0 last:pb-0 flex items-start gap-3">

            <div class="shrink-0 w-16 h-16 rounded-md p-2 flex items-center justify-center">
                <img [src]="e.imagen" [alt]="e.titulo" class="w-full h-full object-contain">
            </div>

            <div>
                <h3 class="font-bold text-gray-800 dark:text-white mb-1">{{ e.titulo }}</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400">{{ e.escuela }}</p>
                <p class="text-sm text-gray-500 dark:text-gray-400">{{ e.year }}</p>
            </div>
        </div>

        @if (!last) {
        <hr class="border-t border-gray-200 dark:border-gray-700">
        }
        }
    </div>
</div>
