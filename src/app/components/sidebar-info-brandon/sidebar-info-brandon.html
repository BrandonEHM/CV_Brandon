<!-- src/app/components/sidebar-info-brandon/sidebar-info-brandon.html -->

<aside id="default-sidebar" class="fixed top-0 left-0 z-40 w-94 h-screen transition-transform lg:translate-x-0"
    [class.-translate-x-full]="!isSidebarOpen()" [class.translate-x-0]="isSidebarOpen()" aria-label="Sidebar">
    <!-- w-64 -->
    <div
        class="h-full px-3 py-4 bg-[#6c757d] dark:bg-[#0F172A] flex flex-col border-e border-gray-200 dark:border-gray-700 overflow-y-auto">

        <!-- Perfil -->
        <div class="flex flex-col items-center text-center pb-4 mb-4 border-b border-gray-200 dark:border-gray-700">
            <img src="../../assets/images/cv_photo1.png" alt="Foto de Brandon"
                class="w-20 h-20 rounded-full object-cover mb-3 ring-2 ring-gray-200 dark:ring-gray-700">
            <h2 class="text-base font-semibold text-gray-900 dark:text-white">Brandon Enrique Hernández Martínez</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400">Desarrollador de Software/Hardware</p>
        </div>

        <!-- Navegación -->
        <ul class="space-y-2 font-medium flex-1">
            <li>
                <a [routerLink]="['/cv/perfil']" routerLinkActive="bg-gray-100 dark:bg-gray-800"
                    [routerLinkActiveOptions]="{ exact: true }"
                    class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-800 group">
                    <svg class="w-5 h-5 shrink-0 text-gray-500 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                        fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.25 12l8.954-8.955a1.125 1.125 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75" />
                    </svg>
                    <span class="ms-3">Inicio</span>
                </a>
            </li>
            <li>
                <a routerLink="/sobre-mi" routerLinkActive="bg-gray-100 dark:bg-gray-800"
                    class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-800 group">
                    <svg class="w-5 h-5 shrink-0 text-gray-500 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                        fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span class="ms-3">Sobre mí</span>
                </a>
            </li>
            <li>
                <a routerLink="/experiencia" routerLinkActive="bg-gray-100 dark:bg-gray-800"
                    class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-800 group">
                    <svg class="w-5 h-5 shrink-0 text-gray-500 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                        fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 00.75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 00-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0112 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 01-.673-.38m0 0A2.18 2.18 0 013 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 013.413-.387m7.5 0V5.25A2.25 2.25 0 0013.5 3h-3a2.25 2.25 0 00-2.25 2.25v.894m7.5 0a48.667 48.667 0 00-7.5 0" />
                    </svg>
                    <span class="ms-3">Experiencia</span>
                </a>
            </li>
            <li>
                <a routerLink="/educacion" routerLinkActive="bg-gray-100 dark:bg-gray-800"
                    class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-800 group">
                    <svg class="w-5 h-5 shrink-0 text-gray-500 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                        fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                    </svg>
                    <span class="ms-3">Educación</span>
                </a>
            </li>
            <li>
                <a routerLink="/habilidades" routerLinkActive="bg-gray-100 dark:bg-gray-800"
                    class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-800 group">
                    <svg class="w-5 h-5 shrink-0 text-gray-500 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                        fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.562.562 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
                    </svg>
                    <span class="ms-3">Habilidades</span>
                </a>
            </li>
            <li>
                <a routerLink="/proyectos" routerLinkActive="bg-gray-100 dark:bg-gray-800"
                    class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-800 group">
                    <svg class="w-5 h-5 shrink-0 text-gray-500 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                        fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-19.5 0v6a2.25 2.25 0 002.25 2.25h15a2.25 2.25 0 002.25-2.25v-6m-19.5 0V6.108c0-1.135.845-2.098 1.976-2.192.373-.03.748-.057 1.123-.08m16.401 2.272a2.25 2.25 0 00-1.976-2.192 48.424 48.424 0 00-1.123-.08m0 0V5.25A2.25 2.25 0 0013.5 3h-3a2.25 2.25 0 00-2.25 2.25v.894m7.5 0a48.667 48.667 0 00-7.5 0" />
                    </svg>
                    <span class="ms-3">Proyectos</span>
                </a>
            </li>
            <li>
                <a routerLink="/contacto" routerLinkActive="bg-gray-100 dark:bg-gray-800"
                    class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-800 group">
                    <svg class="w-5 h-5 shrink-0 text-gray-500 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                        fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                    </svg>
                    <span class="ms-3">Contacto</span>
                </a>
            </li>
        </ul>



        <!-- Tema -->
        <div class="pt-2 pb-2">
            <button type="button" (click)="toggleTheme()"
                class="w-full flex items-center gap-2 p-2 rounded-lg text-white dark:text-gray-300 hover:bg-gray-100 hover:text-black dark:hover:bg-gray-800 dark:hover:text-white! transition"><!-- Forzar el cambio de letras del boton varia el modo claro u oscuro-->
                @if (themeService.isDarkMode()) {
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                </svg>
                <span class="text-sm font-medium">Modo claro</span>
                } @else {
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                </svg>
                <span class="text-sm font-medium">Modo oscuro</span>
                }
            </button>
        </div>

        <!-- Descargar CV -->
        <div class="pt-2 border-t border-gray-200 dark:border-gray-700">
            <a href="/cv-brandon.pdf" download
                class="flex items-center justify-center gap-2 w-full p-2 rounded-lg bg-gray-900 text-white hover:bg-gray-700 dark:bg-white dark:text-gray-900 dark:hover:bg-gray-200 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                </svg>
                <span class="text-sm font-medium">Descargar CV</span>
            </a>
        </div>
    </div>


</aside>

@if (isSidebarOpen()) {
<button type="button" aria-label="Cerrar sidebar" class="fixed inset-0 z-30 bg-black/40 lg:hidden"
    (click)="closeSidebar()"></button>
}

<div class="lg:ml-94 flex flex-col min-h-screen">
    <div class="fixed top-0 left-0 right-0 z-30 lg:left-94">
        <div class="flex flex-row m-0 p-0 w-full">
            <button aria-controls="default-sidebar" type="button" (click)="toggleSidebar()"
                [attr.aria-expanded]="isSidebarOpen()"
                class="inline-flex items-center py-2 px-4 text-sm bg-white dark:bg-[#0F172A] text-gray-500 lg:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-800 dark:focus:ring-gray-700">
                <span class="sr-only">Abrir sidebar</span>
                <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg">
                    <path clip-rule="evenodd" fill-rule="evenodd"
                        d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z">
                    </path>
                </svg>
            </button>

            <app-layout-header class="block w-full flex-1 min-w-0"></app-layout-header>
        </div>
    </div>

    <main class="flex-1 px-8 pb-6 pt-16">
        <div class="max-w-8xl mx-auto">
            <router-outlet />
        </div>
    </main>
</div>
